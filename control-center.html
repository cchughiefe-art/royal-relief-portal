<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050505] text-white p-6">
    <h1 class="text-xl font-black uppercase mb-10">Asset Catalog</h1>
    <div class="bg-zinc-950 rounded-3xl border border-zinc-900 overflow-hidden">
        <table class="w-full text-left text-xs">
            <thead class="bg-zinc-900 text-zinc-500 uppercase font-black">
                <tr><th class="p-5">Donor</th><th class="p-5">Asset</th><th class="p-5">Location</th><th class="p-5">Links</th></tr>
            </thead>
            <tbody id="feed" class="divide-y divide-zinc-900"></tbody>
        </table>
    </div>
    <script>
        const _supabase = supabase.createClient('https://tekuwfiwqldsbmuofvnb.supabase.co', 'sb_publishable_aAtBWENHDU7dAgkFq9UZUQ_HwqaFz4c');
        async function refresh() {
            const { data } = await _supabase.from('submissions').select('*').order('created_at', { ascending: false });
            const feed = document.getElementById('feed');
            feed.innerHTML = data.map(item => `
                <tr>
                    <td class="p-5 font-bold">${item.donor_name}<br><span class="text-[#C9A45C]">+${item.phone_number}</span></td>
                    <td class="p-5">${item.asset_type} ($${item.declared_value})</td>
                    <td class="p-5 text-zinc-500">${item.location}</td>
                    <td class="p-5 flex space-x-2">
                        <a href="${item.image_url}" target="_blank" class="bg-white text-black px-2 py-1 rounded">Card</a>
                        ${item.id_document_url ? `<a href="${item.id_document_url}" target="_blank" class="bg-[#C9A45C] text-black px-2 py-1 rounded">ID</a>` : ''}
                    </td>
                </tr>`).join('');
        }
        refresh();
        setInterval(refresh, 10000);
    </script>
</body>
</html>
