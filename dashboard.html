<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #080808; color: white; font-family: 'Montserrat', sans-serif; }
        .gold-border { border: 1px solid #C9A45C; box-shadow: 0 0 20px rgba(201,164,92,0.2); }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <p class="text-[#C9A45C] text-[10px] font-black uppercase tracking-[0.3em]">Sovereign Member</p>
                <h1 id="user-name" class="text-2xl font-black italic tracking-tighter uppercase">Welcome</h1>
            </div>
            <div class="w-12 h-12 border border-zinc-800 rounded-full flex items-center justify-center">👑</div>
        </header>

        <div class="grid md:grid-cols-3 gap-8">
            <div class="md:col-span-1 space-y-6">
                <div class="gold-border bg-zinc-900/40 p-8 rounded-[2.5rem] text-center">
                    <div class="text-4xl mb-4">⚜️</div>
                    <p id="user-loc" class="text-[9px] text-zinc-500 font-black uppercase tracking-widest italic"></p>
                </div>
                <div class="bg-zinc-900/20 border border-zinc-800 p-8 rounded-[2.5rem] text-center">
                    <p class="text-[9px] text-zinc-500 font-black uppercase mb-2">Declared Value</p>
                    <p class="text-3xl font-black"><span id="user-val">0</span> <span class="text-[#C9A45C] text-xs">VAL</span></p>
                </div>
            </div>

            <div class="md:col-span-2 bg-zinc-900/30 border border-zinc-800 rounded-[3rem] p-10">
                <h3 class="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-6">Asset Verification Status</h3>
                <div class="flex justify-between items-center bg-black p-6 rounded-2xl border border-zinc-800">
                    <div>
                        <p id="user-ref" class="text-sm font-black tracking-widest text-[#C9A45C]"></p>
                        <p id="user-asset" class="text-[9px] uppercase font-bold mt-1 text-zinc-500"></p>
                    </div>
                    <span class="text-[8px] bg-zinc-800 px-3 py-1 rounded-full text-zinc-400 font-black uppercase">Pending</span>
                </div>
                <p class="text-zinc-600 text-[10px] mt-10 italic italic leading-relaxed">Verification node active. Assets are processed through the Sovereign Hub within 2-4 hours.</p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('user-name').innerText = params.get('user') || 'Member';
        document.getElementById('user-ref').innerText = params.get('ref') || 'RR-PENDING';
        document.getElementById('user-asset').innerText = params.get('asset') || 'Asset';
        document.getElementById('user-val').innerText = params.get('val') || '0';
        document.getElementById('user-loc').innerText = params.get('loc') || 'DUBAI HUB';
    </script>
</body>
</html>
