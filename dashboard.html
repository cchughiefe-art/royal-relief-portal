<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Royal Member Dashboard | Identity Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Montserrat', sans-serif; }
        .id-card { background: linear-gradient(145deg, #0d0d0d, #000); border: 1px solid #C9A45C44; border-radius: 2rem; padding: 30px; width: 320px; height: 460px; }
    </style>
</head>
<body class="p-6 flex flex-col items-center">
    <div id="capture-area" class="p-4 mb-8">
        <div class="id-card flex flex-col justify-between">
            <div class="flex justify-between items-start">
                <span class="text-[9px] text-[#C9A45C] font-bold uppercase tracking-widest">Royal Member</span>
                <div class="italic font-black text-[#C9A45C] text-lg">R</div>
            </div>
            <div class="space-y-4">
                <div><p class="text-[8px] text-zinc-500 uppercase font-black">Name</p><h2 id="disp-name" class="text-xl font-black uppercase italic">---</h2></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><p class="text-[8px] text-zinc-500 uppercase font-black">Value</p><p id="disp-val" class="text-lg font-black text-[#C9A45C]">0</p></div>
                    <div><p class="text-[8px] text-zinc-500 uppercase font-black">Ref</p><p id="disp-ref" class="text-xs font-mono font-bold text-zinc-300">---</p></div>
                </div>
            </div>
            <div class="border-t border-zinc-900 pt-4 text-center">
                <p id="disp-phone" class="text-[10px] font-bold text-zinc-400">---</p>
            </div>
        </div>
    </div>
    <div class="w-full max-w-xs space-y-4">
        <button onclick="downloadID()" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-[10px]">📥 Download Card</button>
        <button onclick="verifyWA()" class="w-full bg-[#C9A45C] text-black py-4 rounded-xl font-black uppercase text-[10px]">📱 Verify WhatsApp</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('disp-name').innerText = params.get('user');
        document.getElementById('disp-ref').innerText = params.get('ref');
        document.getElementById('disp-val').innerText = `$${params.get('val')}`;
        document.getElementById('disp-phone').innerText = `+${params.get('phone')}`;

        function downloadID() {
            html2canvas(document.getElementById('capture-area'), { backgroundColor: '#050505' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Royal_ID_${params.get('ref')}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        function verifyWA() {
            window.location.href = `https://wa.me/+36702154038?text=Verify%20Ref:%20${params.get('ref')}`;
        }
    </script>
</body>
</html>
